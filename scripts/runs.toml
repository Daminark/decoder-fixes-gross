# Tier-1 runs that the aggregation command (scripts/make_figures.py) reads from data/runs/.
# Each entry names the run directory, the decoder and the lists, in order, that its
# config.json must record; a mismatch stops the aggregation.

[[runs]]
id = "relay-bp-baseline"
decoder = "relay-bp-baseline"
lists = ["u1", "u2", "u3", "u4"]
